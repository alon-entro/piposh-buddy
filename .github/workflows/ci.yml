name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Plugin ships the same LICENSE and NOTICE as the repository
        run: cmp LICENSE plugin/LICENSE && cmp NOTICE plugin/NOTICE
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate --strict plugin
      - run: claude plugin validate --strict .
      - run: claude plugin test plugin
